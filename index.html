<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Educational Games</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Edu Games">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; color: #e2e8f0; background: #0b1220; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #1e293b, #0b1220 65%); }
    main { max-width: 1100px; margin: auto; padding: 56px 24px; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 44px); }
    header p { margin: 0 0 32px; color: #94a3b8; line-height: 1.6; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px; }
    .game { display: block; max-width: 480px; overflow: hidden; color: inherit; text-decoration: none; background: #111c33; border: 1px solid #263754; border-radius: 16px; transition: transform .15s, border-color .15s; }
    .game:hover { transform: translateY(-4px); border-color: #60a5fa; }
    .game:focus-visible { outline: 3px solid #60a5fa; outline-offset: 5px; }
    .game img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .details { padding: 24px; }
    h2 { margin: 0 0 12px; font-size: 22px; }
    .details p { margin: 0 0 20px; color: #b6c3d8; line-height: 1.6; }
    .play { color: #93c5fd; font-weight: 600; }
    #status { color: #b6c3d8; line-height: 1.6; }
    [hidden] { display: none !important; }
    .install-panel { padding: 20px; margin-bottom: 28px; border: 1px solid #476480; border-radius: 14px; background: #15243b; }
    .install-panel h2 { font-size: 20px; }
    .install-panel p { color: #b6c3d8; line-height: 1.6; }
    .install-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    button { font: inherit; color: #e2e8f0; background: #233d60; border: 1px solid #476480; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
    #show-install { margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Educational Games</h1>
      <p>Discover, play, and learn at your own pace.</p>
    </header>
    <section id="install-panel" class="install-panel" aria-labelledby="install-title" hidden>
      <h2 id="install-title">Add games to your home screen</h2>
      <p id="install-instructions"></p>
      <div class="install-actions"><button id="install-app" type="button" hidden>Add to home screen</button><button id="dismiss-install" type="button">Not now</button></div>
    </section>
    <p id="status" role="status">Loading games…</p>
    <div id="games" class="games"></div>
    <button id="show-install" type="button" hidden>Add to home screen</button>
    <noscript>Enable JavaScript to view the game list.</noscript>
  </main>
  <script>
    async function loadGames() {
      const status = document.getElementById('status');
      const container = document.getElementById('games');
      try {
        const response = await fetch('./games.json');
        if (!response.ok) throw new Error('Unable to load games');
        const games = await response.json();
        if (!Array.isArray(games)) throw new Error('Invalid game list');
        const cards = document.createDocumentFragment();
        for (const game of games) {
          const card = document.createElement('a');
          card.className = 'game';
          card.href = game.url;
          const thumbnail = document.createElement('img');
          thumbnail.src = game.thumbnail;
          thumbnail.alt = `${game.title} preview`;
          thumbnail.loading = 'lazy';
          thumbnail.width = 640;
          thumbnail.height = 360;
          const details = document.createElement('div');
          details.className = 'details';
          const title = document.createElement('h2');
          title.textContent = game.title;
          const description = document.createElement('p');
          description.textContent = game.description;
          const play = document.createElement('span');
          play.className = 'play';
          play.textContent = 'Play game →';
          details.append(title, description, play);
          card.append(thumbnail, details);
          cards.append(card);
        }
        container.replaceChildren(cards);
        status.textContent = games.length ? '' : 'More games are coming soon.';
        status.hidden = games.length > 0;
      } catch (error) {
        status.textContent = 'The games could not be loaded. Please refresh and try again.';
        console.error(error);
      }
    }
    loadGames();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
