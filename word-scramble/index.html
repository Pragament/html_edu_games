<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Value Education Word Scramble</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<a class="home" href="../index.html">← All games</a>
<header><p class="eyebrow">VALUE EDUCATION</p><h1>Word Scramble</h1><p id="subtitle">Unscramble the letters to discover values and good habits.</p></header>
<div class="controls"><label for="puzzle-select">Puzzle</label><select id="puzzle-select" disabled></select><button id="reset" type="button" disabled>Start again</button></div>
<p class="instructions">Read the description, rearrange the letters, and type the value or good habit. Use hints one at a time if you need help. Press Enter or Check answer to check your word.</p>
<div class="progress"><p id="status" role="status" aria-live="polite">Loading puzzles…</p><progress id="progress" max="1" value="0" aria-label="Words solved"></progress></div>
<div id="cards" class="cards"></div>
<noscript>Enable JavaScript to play this game.</noscript>
