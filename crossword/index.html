<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Value Education Crossword — Classes III–V</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ INTERACTIVE APP ============ -->
<div class="app">
  <header class="top">
    <h1>Value Education Crossword</h1>
    <p>Classes III – V &nbsp;•&nbsp; CBSE Value Education</p>
    <label for="puzzle-select">Choose a puzzle</label>
    <select id="puzzle-select" disabled><option>Loading puzzles…</option></select>
    <p id="puzzle-load-status" role="status">Loading puzzles…</p>
    <div class="chips"></div>
  </header>

  <div class="layout">
    <section class="card">
      <div class="grid-wrap">
        <div id="grid" tabindex="0"></div>
      </div>
      <div class="toolbar">
        <button id="btn-check">✔ Check</button>
        <button id="btn-letter">Reveal Letter</button>
        <button id="btn-word">Reveal Word</button>
        <button id="btn-all">Reveal All</button>
        <button id="btn-clear">Clear</button>
      </div>
      <p class="hint">Click a box and type. Click the same box again to switch between <b>Across</b> and <b>Down</b>. Use arrow keys to move, Tab for the next clue.</p>
      <div class="status" id="status"></div>
    </section>

    <section class="card clues-card">
      <div class="clue-col">
        <h3>Across</h3>
        <ul id="across-list"></ul>
      </div>
      <div class="clue-col">
        <h3>Down</h3>
        <ul id="down-list"></ul>
      </div>
    </section>
  </div>

  <div class="print-bar">
    <button id="btn-print" class="primary">🖨️ Download / Print A4 Worksheet (with Answers &amp; Explanations)</button>
  </div>
</div>

<!-- ============ PRINT AREA ============ -->
<div id="print-area"></div>

<script src="script.js"></script>
</body>
</html>
